name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build macOS app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build Swift package
        working-directory: macapp
        run: swift build

      - name: Create Python virtual environment
        run: python3 -m venv .venv

      - name: Install Python runtime dependencies
        run: .venv/bin/python -m pip install -r sidecar/requirements.txt

      - name: Check Python syntax
        run: |
          .venv/bin/python -m py_compile sidecar/gpsd_helper.py sidecar/fakegps_runtime.py

      - name: Check pymobiledevice3 no-root API
        run: |
          .venv/bin/python - <<'PY'
          from pymobiledevice3.remote.rsd_tunnel import PreferredRsdTunnel
          from pymobiledevice3.services.dvt.instruments.dvt_provider import DvtProvider
          from pymobiledevice3.services.dvt.instruments.location_simulation import LocationSimulation

          tunnel = PreferredRsdTunnel(serial=None, autopair=True, prefer_native=True)
          assert hasattr(tunnel, "aopen")
          assert hasattr(tunnel, "aclose")
          assert LocationSimulation.set
          assert LocationSimulation.clear
          print("pymobiledevice3 no-root RSD/DVT API OK")
          PY
